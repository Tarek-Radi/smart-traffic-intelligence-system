[project]
name = "smart-traffic-intelligence-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_core"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
